<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <!-- Rich Luxury Gold Gradient -->
        <linearGradient id="vmGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fff1cc" />
            <stop offset="25%" stop-color="#dfa243" />
            <stop offset="55%" stop-color="#c58622" />
            <stop offset="85%" stop-color="#9e6411" />
            <stop offset="100%" stop-color="#784206" />
        </linearGradient>

        <!-- Gold Bevel Gradient -->
        <linearGradient id="vmBevelLight" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#dfa243" stop-opacity="0.3" />
        </linearGradient>

        <!-- Shadow Filter -->
        <filter id="vmGoldGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#b45309" flood-opacity="0.3" />
        </filter>

        <!-- Silver Rod Gradient -->
        <linearGradient id="vmSilverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f8fafc" />
            <stop offset="40%" stop-color="#ffffff" />
            <stop offset="70%" stop-color="#cbd5e1" />
            <stop offset="100%" stop-color="#64748b" />
        </linearGradient>

        <!-- Ribbon Parchment Gradient -->
        <linearGradient id="vmRibbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="40%" stop-color="#fffbeb" />
            <stop offset="100%" stop-color="#fef3c7" />
        </linearGradient>
    </defs>

    <!-- Outer Soft Glow Background (Optional) -->
    <circle cx="100" cy="95" r="88" fill="url(#vmGoldGrad)" opacity="0.04" />

    <!-- 1. LAUREL WREATH (ROYAL LEAVES) -->
    <!-- Left Branch -->
    <g fill="url(#vmGoldGrad)" stroke="#8c4d05" stroke-width="0.5" filter="url(#vmGoldGlow)">
        <!-- Stem Left -->
        <path d="M 68 162 C 34 140 18 100 24 55" fill="none" stroke="url(#vmGoldGrad)" stroke-width="2.5" stroke-linecap="round" />
        <!-- Leaves Left -->
        <path d="M 24 55 C 20 48 24 40 32 45 C 32 52 28 55 24 55 Z" />
        <path d="M 28 47 C 33 42 41 44 39 52 C 34 53 30 50 28 47 Z" />
        <path d="M 21 68 C 14 63 15 54 24 57 C 26 64 23 68 21 68 Z" />
        <path d="M 26 63 C 32 58 40 61 38 69 C 33 70 28 66 26 63 Z" />
        <path d="M 20 83 C 12 79 12 70 21 72 C 24 79 22 83 20 83 Z" />
        <path d="M 25 79 C 32 75 40 79 37 87 C 32 87 27 83 25 79 Z" />
        <path d="M 22 101 C 14 98 13 89 22 89 C 26 96 24 101 22 101 Z" />
        <path d="M 28 97 C 35 94 42 100 38 107 C 33 107 29 101 28 97 Z" />
        <path d="M 28 119 C 20 118 18 109 27 108 C 31 115 30 119 28 119 Z" />
        <path d="M 33 117 C 41 115 47 122 42 128 C 37 127 34 121 33 117 Z" />
        <path d="M 38 137 C 30 138 27 129 36 127 C 41 133 40 137 38 137 Z" />
        <path d="M 43 135 C 52 135 56 143 50 149 C 45 147 43 140 43 135 Z" />
        <path d="M 52 153 C 44 156 39 148 48 144 C 54 149 54 153 52 153 Z" />
        <path d="M 58 150 C 67 151 70 160 63 165 C 59 162 58 155 58 150 Z" />
    </g>

    <!-- Right Branch -->
    <g fill="url(#vmGoldGrad)" stroke="#8c4d05" stroke-width="0.5" filter="url(#vmGoldGlow)">
        <!-- Stem Right -->
        <path d="M 132 162 C 166 140 182 100 176 55" fill="none" stroke="url(#vmGoldGrad)" stroke-width="2.5" stroke-linecap="round" />
        <!-- Leaves Right -->
        <path d="M 176 55 C 180 48 176 40 168 45 C 168 52 172 55 176 55 Z" />
        <path d="M 172 47 C 167 42 159 44 161 52 C 166 53 170 50 172 47 Z" />
        <path d="M 179 68 C 186 63 185 54 176 57 C 174 64 177 68 179 68 Z" />
        <path d="M 174 63 C 168 58 160 61 162 69 C 167 70 172 66 174 63 Z" />
        <path d="M 180 83 C 188 79 188 70 179 72 C 176 79 178 83 180 83 Z" />
        <path d="M 175 79 C 168 75 160 79 163 87 C 168 87 173 83 175 79 Z" />
        <path d="M 178 101 C 186 98 187 89 178 89 C 174 96 176 101 178 101 Z" />
        <path d="M 172 97 C 165 94 158 100 162 107 C 167 107 171 101 172 97 Z" />
        <path d="M 172 119 C 180 118 182 109 173 108 C 169 115 170 119 172 119 Z" />
        <path d="M 167 117 C 159 115 153 122 158 128 C 163 127 166 121 167 117 Z" />
        <path d="M 162 137 C 170 138 173 129 164 127 C 159 133 160 137 162 137 Z" />
        <path d="M 157 135 C 148 135 144 143 150 149 C 155 147 157 140 157 135 Z" />
        <path d="M 148 153 C 156 156 161 148 152 144 C 146 149 146 153 148 153 Z" />
        <path d="M 142 150 C 133 151 130 160 137 165 C 141 162 142 155 142 150 Z" />
    </g>

    <!-- 2. LUXURY MEDICAL CROSS -->
    <!-- Drop Shadow Outer -->
    <path d="M 78 28 L 122 28 L 122 68 L 162 68 L 162 112 L 122 112 L 122 152 L 78 152 L 78 112 L 38 112 L 38 68 L 78 68 Z" 
          fill="rgba(92, 46, 2, 0.25)" />

    <!-- Main Cross Body with Luxury Gold Finish -->
    <path d="M 80 30 L 120 30 L 120 70 L 160 70 L 160 110 L 120 110 L 120 150 L 80 150 L 80 110 L 40 110 L 40 70 L 80 70 Z" 
          fill="url(#vmGoldGrad)" stroke="#663300" stroke-width="2" stroke-linejoin="round" />

    <!-- Inner Beveled Frame -->
    <path d="M 84 34 L 116 34 L 116 74 L 156 74 L 156 106 L 116 106 L 116 146 L 84 146 L 84 106 L 44 106 L 44 74 L 84 74 Z" 
          fill="none" stroke="url(#vmBevelLight)" stroke-width="1.8" />

    <!-- Subtle Inner Shading -->
    <rect x="85" y="35" width="30" height="110" fill="#ffffff" opacity="0.08" />
    <rect x="45" y="75" width="110" height="30" fill="#ffffff" opacity="0.08" />

    <!-- 3. PROMINENT BOLD LETTERS V AND M (HIGH CONTRAST & VISIBILITY) -->
    <!-- Letter V on Left Arm -->
    <!-- Shadow for 3D Depth -->
    <text x="60.5" y="99.5" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="28" text-anchor="middle" fill="#3d1e01" opacity="0.8">V</text>
    <!-- Dark Gold Base -->
    <text x="60" y="99" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="28" text-anchor="middle" fill="#5c3004">V</text>
    <!-- Bright Top Highlight -->
    <text x="59.2" y="97.8" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="28" text-anchor="middle" fill="#fff9e6">V</text>
    <!-- Crisp Gold Face -->
    <text x="59.5" y="98.2" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="27.5" text-anchor="middle" fill="url(#vmGoldGrad)">V</text>

    <!-- Letter M on Right Arm -->
    <!-- Shadow for 3D Depth -->
    <text x="140.5" y="99.5" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="28" text-anchor="middle" fill="#3d1e01" opacity="0.8">M</text>
    <!-- Dark Gold Base -->
    <text x="140" y="99" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="28" text-anchor="middle" fill="#5c3004">M</text>
    <!-- Bright Top Highlight -->
    <text x="139.2" y="97.8" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="28" text-anchor="middle" fill="#fff9e6">M</text>
    <!-- Crisp Gold Face -->
    <text x="139.5" y="98.2" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="27.5" text-anchor="middle" fill="url(#vmGoldGrad)">M</text>

    <!-- 4. ROD OF ASCLEPIUS (MEDICAL STAFF & SERPENT) -->
    <g id="asclepius-staff">
        <!-- Staff Drop Shadow -->
        <rect x="99.5" y="40" width="4" height="102" rx="2" fill="rgba(60, 30, 2, 0.4)" />
        
        <!-- Central Staff in Chrome/Silver with Fine Bevel -->
        <rect x="98" y="38" width="4" height="102" rx="2" fill="url(#vmSilverGrad)" stroke="#475569" stroke-width="0.75" />
        
        <!-- Knob on Top of Staff -->
        <circle cx="100" cy="37" r="5" fill="url(#vmSilverGrad)" stroke="#475569" stroke-width="0.75" />
        <circle cx="98.5" cy="35.5" r="1.5" fill="#ffffff" />

        <!-- Sacred Serpent Coiling around Staff (White/Silver with 3D Depth) -->
        <!-- Loop 1 (Upper) -->
        <path d="M 94 48 C 88 52 86 60 92 65 C 98 70 108 64 107 56 C 106 50 101 48 97 49" 
              fill="none" stroke="#334155" stroke-width="3.6" stroke-linecap="round" />
        <path d="M 94 48 C 88 52 86 60 92 65 C 98 70 108 64 107 56 C 106 50 101 48 97 49" 
              fill="none" stroke="url(#vmSilverGrad)" stroke-width="2.6" stroke-linecap="round" />

        <!-- Loop 2 (Middle) -->
        <path d="M 92 65 C 84 72 84 83 93 89 C 102 95 113 88 111 78 C 110 71 103 68 96 71" 
              fill="none" stroke="#334155" stroke-width="3.8" stroke-linecap="round" />
        <path d="M 92 65 C 84 72 84 83 93 89 C 102 95 113 88 111 78 C 110 71 103 68 96 71" 
              fill="none" stroke="url(#vmSilverGrad)" stroke-width="2.8" stroke-linecap="round" />

        <!-- Loop 3 (Lower) -->
        <path d="M 93 89 C 85 97 85 110 94 117 C 103 124 115 117 112 105 C 110 97 103 94 96 97" 
              fill="none" stroke="#334155" stroke-width="4.0" stroke-linecap="round" />
        <path d="M 93 89 C 85 97 85 110 94 117 C 103 124 115 117 112 105 C 110 97 103 94 96 97" 
              fill="none" stroke="url(#vmSilverGrad)" stroke-width="3.0" stroke-linecap="round" />

        <!-- Tail (Wrapping down) -->
        <path d="M 94 117 C 91 125 96 135 101 138" 
              fill="none" stroke="#334155" stroke-width="3.2" stroke-linecap="round" />
        <path d="M 94 117 C 91 125 96 135 101 138" 
              fill="none" stroke="url(#vmSilverGrad)" stroke-width="2.2" stroke-linecap="round" />

        <!-- Serpent Head at Top -->
        <path d="M 97 49 C 99 47 101 44 100 42 C 98 41 95 44 94 48 Z" 
              fill="url(#vmSilverGrad)" stroke="#334155" stroke-width="0.75" />
        <circle cx="98.5" cy="43.5" r="0.65" fill="#1e293b" />
    </g>

    <!-- 5. RIBBON SCROLL BANNER (EST. 2026) -->
    <!-- Ribbon Shadow -->
    <path d="M 28 168 L 42 160 L 42 178 L 28 186 Z M 172 168 L 158 160 L 158 178 L 172 186 Z" 
          fill="rgba(80, 40, 2, 0.3)" />

    <!-- Ribbon Tails (Left & Right Folds) -->
    <!-- Left Tail Fold -->
    <path d="M 24 167 L 44 158 L 44 180 L 24 188 L 33 177 Z" 
          fill="#ecd599" stroke="#78350f" stroke-width="1.2" />
    <!-- Left Fold Under -->
    <path d="M 44 175 L 54 182 L 44 182 Z" fill="#662f03" />

    <!-- Right Tail Fold -->
    <path d="M 176 167 L 156 158 L 156 180 L 176 188 L 167 177 Z" 
          fill="#ecd599" stroke="#78350f" stroke-width="1.2" />
    <!-- Right Fold Under -->
    <path d="M 156 175 L 146 182 L 156 182 Z" fill="#662f03" />

    <!-- Central Sweeping Ribbon Banner Body -->
    <path d="M 44 162 C 72 153 128 153 156 162 L 152 184 C 126 175 74 175 48 184 Z" 
          fill="url(#vmRibbonGrad)" stroke="url(#vmGoldGrad)" stroke-width="2" />
    <path d="M 47 164 C 74 156 126 156 153 164" 
          fill="none" stroke="#78350f" stroke-width="0.75" />
    <path d="M 50 181 C 76 173 124 173 150 181" 
          fill="none" stroke="#78350f" stroke-width="0.75" />

    <!-- 6. CRISP "EST. 2026" TYPOGRAPHY INSIDE BANNER -->
    <!-- Drop Shadow for Text -->
    <text x="100" y="174.5" 
          font-family="'Plus Jakarta Sans', 'Outfit', 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="11.5" 
          letter-spacing="2.2" 
          text-anchor="middle" 
          fill="#451a03">
        EST. 2026
    </text>
    <!-- Highlight Overlay -->
    <text x="99.7" y="173.8" 
          font-family="'Plus Jakarta Sans', 'Outfit', 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="11.5" 
          letter-spacing="2.2" 
          text-anchor="middle" 
          fill="#854d0e">
        EST. 2026
    </text>
</svg>
